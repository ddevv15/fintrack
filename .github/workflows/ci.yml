name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first, so CI minutes go to the
# commit you actually care about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders, valid in shape so lib/env.ts passes its Zod check. No job here
  # talks to a real backend; when one does, these move to repository secrets.
  NEXT_PUBLIC_INSFORGE_URL: https://ci-placeholder.insforge.app
  NEXT_PUBLIC_INSFORGE_ANON_KEY: ci-placeholder-anon-key
  APP_CURRENCY: USD
  APP_TIMEZONE: America/New_York

jobs:
  check:
    name: Lint, format, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each check runs even if an earlier one failed, so one push reports every
      # problem at once instead of one per re-run.
      - name: Format
        if: "!cancelled()"
        run: npm run format:check

      - name: Lint
        if: "!cancelled()"
        run: npm run lint

      - name: Types
        if: "!cancelled()"
        run: npm run typecheck

      - name: Unit tests
        if: "!cancelled()"
        run: npm run test

  e2e:
    name: End to end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The Playwright config builds and starts the app itself in CI, so this
      # also proves the production build compiles.
      - name: Run Playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
