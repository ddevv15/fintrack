name: CI

on:
  # Pull requests are the gate, so they run CI for every branch. Pushes only
  # build main. Before this split, a push to a branch with an open pull request
  # triggered both events and ran the whole suite twice on the same commit,
  # including the eight minute browser job.
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first, so CI minutes go to the
# commit you actually care about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders, valid in shape so lib/env.ts passes its Zod check. No job here
  # talks to a real backend; when one does, these move to repository secrets.
  NEXT_PUBLIC_INSFORGE_URL: https://ci-placeholder.insforge.app
  NEXT_PUBLIC_INSFORGE_ANON_KEY: ci-placeholder-anon-key
  # The origin the app answers on. Required, not optional, because the Google
  # callback URL is built from it. localhost:3000 here because that is where
  # Playwright's webServer serves the build, and no CI job talks to Google.
  APP_URL: http://localhost:3000
  APP_CURRENCY: USD
  APP_TIMEZONE: America/New_York
  # Whether this repository has the backend test secrets. Computed here because
  # a step's own env block is not readable from that step's `if` condition, and
  # the secrets context is not dependable there either.
  HAS_BACKEND_SECRETS: ${{ secrets.INSFORGE_TEST_PASSWORD != '' }}

jobs:
  check:
    name: Lint, format, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Each check runs even if an earlier one failed, so one push reports every
      # problem at once instead of one per re-run.
      - name: Format
        if: "!cancelled()"
        run: npm run format:check

      - name: Lint
        if: "!cancelled()"
        run: npm run lint

      - name: Types
        if: "!cancelled()"
        run: npm run typecheck

      - name: Unit tests
        if: "!cancelled()"
        run: npm run test

      # Talks to the real backend and signs in as two accounts, so it only runs
      # where the secrets exist. A fork, or a repository without them, skips
      # this step rather than failing on a missing value.
      - name: Integration tests
        if: "!cancelled() && env.HAS_BACKEND_SECRETS == 'true'"
        env:
          NEXT_PUBLIC_INSFORGE_URL: ${{ secrets.INSFORGE_URL }}
          NEXT_PUBLIC_INSFORGE_ANON_KEY: ${{ secrets.INSFORGE_ANON_KEY }}
          INSFORGE_TEST_EMAIL_A: ${{ secrets.INSFORGE_TEST_EMAIL_A }}
          INSFORGE_TEST_EMAIL_B: ${{ secrets.INSFORGE_TEST_EMAIL_B }}
          INSFORGE_TEST_PASSWORD: ${{ secrets.INSFORGE_TEST_PASSWORD }}
        run: npm run test:integration

  e2e:
    name: End to end tests
    runs-on: ubuntu-latest
    # Without this a hung step runs to GitHub's six hour default. The browser
    # install has hung before; this turns that into a fast, obvious failure.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # On a cache hit only the system libraries are installed, which is the
      # fast part. The browser download is what takes the minutes.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The Playwright config builds and starts the app itself in CI, so this
      # also proves the production build compiles.
      - name: Run Playwright
        # The accessibility check points axe at the design gallery, and that
        # route 404s without this flag. An axe violation fails the run.
        env:
          UI_GALLERY: "1"
        run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
