<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">FinTrack — Know where the month went</title>
  <desc id="description">Open-source personal spending tracker with a preview of its monthly category breakdown.</desc>

  <rect width="1280" height="640" fill="#fdfcf9" />
  <rect x="1" y="1" width="1278" height="638" rx="28" fill="none" stroke="#e8e5df" stroke-width="2" />

  <g transform="translate(72 70)">
    <rect width="196" height="36" rx="18" fill="#ffffff" stroke="#d9d5ce" />
    <circle cx="20" cy="18" r="5" fill="#1f8a3b" />
    <text x="34" y="23" fill="#4e4c47" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.3">OPEN SOURCE · V0.1.0</text>

    <g transform="translate(0 94)">
      <rect x="0" y="50" width="14" height="34" rx="7" fill="#1f8a3b" />
      <rect x="24" y="28" width="14" height="56" rx="7" fill="#2369c8" />
      <rect x="48" y="0" width="14" height="84" rx="7" fill="#ce272f" />
    </g>

    <text x="90" y="166" fill="#1d1c1a" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-3">FinTrack</text>
    <text x="0" y="250" fill="#1d1c1a" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="-1">Know where the month went.</text>
    <text x="0" y="302" fill="#66635d" font-family="Arial, Helvetica, sans-serif" font-size="22">Log a spend. See the month.</text>
    <text x="0" y="334" fill="#66635d" font-family="Arial, Helvetica, sans-serif" font-size="22">Understand the pattern.</text>

    <g transform="translate(0 398)" fill="#ffffff" stroke="#d9d5ce">
      <rect width="148" height="46" rx="12" />
      <rect x="160" width="178" height="46" rx="12" />
      <rect x="350" width="126" height="46" rx="12" />
    </g>
    <g fill="#3d3b37" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
      <text x="22" y="427">Exact money</text>
      <text x="182" y="427">Private by default</text>
      <text x="372" y="427">MIT licensed</text>
    </g>

    <text x="0" y="492" fill="#8a867f" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="0.4">fintrack-eight-sand.vercel.app</text>
  </g>

  <g transform="translate(770 52)">
    <rect width="438" height="536" rx="24" fill="#ffffff" stroke="#d9d5ce" stroke-width="2" />
    <rect x="22" y="20" width="394" height="496" rx="14" fill="#fdfcf9" stroke="#ece9e3" />

    <g transform="translate(48 50)" font-family="Arial, Helvetica, sans-serif">
      <text x="0" y="30" fill="#1d1c1a" font-size="32" font-weight="700">August 2026</text>
      <text x="0" y="55" fill="#66635d" font-size="15">Where your money went</text>

      <text x="0" y="106" fill="#66635d" font-size="15">Total spent</text>
      <text x="0" y="146" fill="#1d1c1a" font-size="38" font-weight="700">$100.00</text>

      <g transform="translate(0 198)">
        <circle cx="5" cy="5" r="5" fill="#1f8a3b" />
        <text x="24" y="11" fill="#2b2926" font-size="16" font-weight="700">Groceries</text>
        <text x="336" y="11" fill="#2b2926" font-size="16" font-weight="700" text-anchor="end">$60.00</text>
        <rect x="0" y="34" width="336" height="5" rx="2.5" fill="#e9e6e0" />
        <rect x="0" y="34" width="202" height="5" rx="2.5" fill="#1f8a3b" />
        <text x="336" y="60" fill="#77736c" font-size="14" text-anchor="end">60%</text>
      </g>

      <g transform="translate(0 286)">
        <line x1="0" y1="-18" x2="336" y2="-18" stroke="#e4e1db" />
        <circle cx="5" cy="5" r="5" fill="#2369c8" />
        <text x="24" y="11" fill="#2b2926" font-size="16" font-weight="700">Transport</text>
        <text x="336" y="11" fill="#2b2926" font-size="16" font-weight="700" text-anchor="end">$30.00</text>
        <rect x="0" y="34" width="336" height="5" rx="2.5" fill="#e9e6e0" />
        <rect x="0" y="34" width="101" height="5" rx="2.5" fill="#2369c8" />
        <text x="336" y="60" fill="#77736c" font-size="14" text-anchor="end">30%</text>
      </g>

      <g transform="translate(0 374)">
        <line x1="0" y1="-18" x2="336" y2="-18" stroke="#e4e1db" />
        <circle cx="5" cy="5" r="5" fill="#ce272f" />
        <text x="24" y="11" fill="#2b2926" font-size="16" font-weight="700">Health</text>
        <text x="336" y="11" fill="#2b2926" font-size="16" font-weight="700" text-anchor="end">$10.00</text>
        <rect x="0" y="34" width="336" height="5" rx="2.5" fill="#e9e6e0" />
        <rect x="0" y="34" width="34" height="5" rx="2.5" fill="#ce272f" />
        <text x="336" y="60" fill="#77736c" font-size="14" text-anchor="end">10%</text>
      </g>
    </g>
  </g>
</svg>
